<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Callisto HUD</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{
      width:100%;height:100%;
      background:transparent;
      overflow:hidden;
      font-family:-apple-system,'Segoe UI',sans-serif;
      -webkit-app-region:no-drag;
      user-select:none;
    }

    /* Cards stack from bottom-right */
    #stack{
      position:fixed;
      bottom:24px;right:24px;
      width:320px;
      display:flex;
      flex-direction:column-reverse;
      gap:10px;
      pointer-events:all;
    }

    .hud-card{
      background:rgba(6,9,24,0.92);
      border:1px solid rgba(61,92,255,0.3);
      border-radius:14px;
      padding:12px 14px;
      backdrop-filter:blur(20px);
      box-shadow:0 8px 32px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.05);
      animation:slideIn 0.22s cubic-bezier(0.34,1.56,0.64,1) forwards;
      position:relative;
      overflow:hidden;
      cursor:default;
      transition:opacity 0.3s,transform 0.3s;
    }
    .hud-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,transparent,rgba(61,92,255,0.6),rgba(0,200,255,0.4),transparent);
    }
    .hud-card.dismissing{opacity:0;transform:translateX(20px) scale(0.96);}

    /* Card types */
    .hud-card.info  {border-color:rgba(61,92,255,0.35);}
    .hud-card.calendar{border-color:rgba(66,133,244,0.4);}
    .hud-card.calendar::before{background:linear-gradient(90deg,transparent,rgba(66,133,244,0.6),transparent);}
    .hud-card.reminder{border-color:rgba(245,158,11,0.4);}
    .hud-card.reminder::before{background:linear-gradient(90deg,transparent,rgba(245,158,11,0.6),transparent);}
    .hud-card.email{border-color:rgba(234,67,53,0.35);}
    .hud-card.email::before{background:linear-gradient(90deg,transparent,rgba(234,67,53,0.5),transparent);}
    .hud-card.wiki{border-color:rgba(80,200,120,0.35);}
    .hud-card.wiki::before{background:linear-gradient(90deg,transparent,rgba(80,200,120,0.5),transparent);}

    /* Card layout */
    .card-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
    .card-icon{font-size:16px;flex-shrink:0;}
    .card-title{font-size:11px;font-weight:700;letter-spacing:2px;color:rgba(100,140,255,0.7);text-transform:uppercase;flex:1;}
    .card-close{background:none;border:none;color:rgba(150,170,255,0.3);font-size:14px;cursor:pointer;line-height:1;padding:0;flex-shrink:0;}
    .card-close:hover{color:rgba(255,255,255,0.6);}

    /* Text bubble */
    .card-text{font-size:13px;line-height:1.55;color:rgba(200,215,255,0.9);max-height:260px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(94,114,228,0.3) transparent;}
    .card-text::-webkit-scrollbar{width:3px;}
    .card-text::-webkit-scrollbar-thumb{background:rgba(94,114,228,0.35);border-radius:2px;}
    .card-text strong{color:#fff;}

    /* Wiki card with image */
    .wiki-body{display:flex;gap:10px;align-items:flex-start;}
    .wiki-img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,0.06);}
    .wiki-text{flex:1;min-width:0;}
    .wiki-name{font-size:13px;font-weight:700;color:#fff;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .wiki-desc{font-size:11.5px;color:rgba(180,200,255,0.7);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

    /* Calendar/Reminder card */
    .event-row{display:flex;align-items:center;gap:8px;}
    .event-icon{font-size:22px;}
    .event-name{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;}
    .event-sub{font-size:11px;color:rgba(150,180,255,0.6);}
    .event-badge{display:inline-block;margin-top:6px;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:2px 7px;border-radius:4px;background:rgba(34,197,94,0.15);color:#22c55e;}

    /* Progress bar (auto-dismiss timer) */
    .timer-bar{position:absolute;bottom:0;left:0;height:2px;background:rgba(61,92,255,0.4);border-radius:0 0 14px 14px;animation:timerBar var(--dur,7s) linear forwards;}
    @keyframes timerBar{from{width:100%}to{width:0%}}

    @keyframes slideIn{
      from{opacity:0;transform:translateX(30px) scale(0.95);}
      to{opacity:1;transform:none;}
    }

    /* Listening indicator */
    #listening{
      position:fixed;bottom:24px;right:24px;
      background:rgba(6,9,24,0.92);
      border:1px solid rgba(61,92,255,0.4);
      border-radius:12px;padding:10px 16px;
      display:none;align-items:center;gap:10px;
      backdrop-filter:blur(20px);
      box-shadow:0 8px 32px rgba(0,0,0,0.5);
    }
    .mic-anim{display:flex;gap:3px;align-items:flex-end;height:16px;}
    .mic-bar{width:3px;border-radius:2px;background:rgba(0,200,255,0.8);animation:micPulse 0.6s ease-in-out infinite;}
    .mic-bar:nth-child(1){height:6px;animation-delay:0s;}
    .mic-bar:nth-child(2){height:12px;animation-delay:0.1s;}
    .mic-bar:nth-child(3){height:16px;animation-delay:0.2s;}
    .mic-bar:nth-child(4){height:10px;animation-delay:0.1s;}
    .mic-bar:nth-child(5){height:6px;animation-delay:0s;}
    @keyframes micPulse{0%,100%{opacity:0.4;transform:scaleY(0.6);}50%{opacity:1;transform:scaleY(1);}}
    .listen-text{font-size:12px;font-weight:600;color:rgba(150,180,255,0.8);}
  </style>
</head>
<body>

<!-- Listening indicator (shown when mic is active) -->
<div id="listening">
  <div class="mic-anim">
    <div class="mic-bar"></div>
    <div class="mic-bar"></div>
    <div class="mic-bar"></div>
    <div class="mic-bar"></div>
    <div class="mic-bar"></div>
  </div>
  <span class="listen-text">Listening...</span>
</div>

<!-- Card stack -->
<div id="stack"></div>

<script>
  const { ipcRenderer } = require('electron');
  const stack = document.getElementById('stack');
  const listeningEl = document.getElementById('listening');

  // ── Show / hide listening indicator ─────────────────────────────────────────
  ipcRenderer.on('hud:listening', () => {
    listeningEl.style.display = 'flex';
    // Auto-hide after 10s as safety net
    setTimeout(() => { listeningEl.style.display = 'none'; }, 10000);
  });
  ipcRenderer.on('hud:listening-stop', () => {
    listeningEl.style.display = 'none';
  });

  // ── Show a card ─────────────────────────────────────────────────────────────
  ipcRenderer.on('hud:card', (_e, data) => {
    listeningEl.style.display = 'none';
    showCard(data);
  });

  function showCard(data) {
    const { type, text, card, title } = data;
    const el = document.createElement('div');
    el.className = `hud-card ${type || 'info'}`;
    const dur = type === 'wiki' ? 10 : 7;
    el.style.setProperty('--dur', dur + 's');

    let inner = '';

    if (type === 'wiki' && card) {
      inner = `
        <div class="card-header">
          <span class="card-icon">🔍</span>
          <span class="card-title">Callisto</span>
          <button class="card-close" onclick="dismiss(this.closest('.hud-card'))">✕</button>
        </div>
        <div class="wiki-body">
          ${card.imageUrl ? `<img class="wiki-img" src="${card.imageUrl}" onerror="this.style.display='none'"/>` : ''}
          <div class="wiki-text">
            <div class="wiki-name">${card.title || ''}</div>
            <div class="wiki-desc">${card.summary || text || ''}</div>
          </div>
        </div>`;
    } else if (type === 'calendar') {
      inner = `
        <div class="card-header">
          <span class="card-icon">📅</span>
          <span class="card-title">Calendar</span>
          <button class="card-close" onclick="dismiss(this.closest('.hud-card'))">✕</button>
        </div>
        <div class="event-row">
          <div>
            <div class="event-name">${title || text || 'Event Added'}</div>
            <div class="event-sub">${card?.when || 'Added to Google Calendar'}</div>
            <span class="event-badge">✓ ADDED</span>
          </div>
        </div>`;
    } else if (type === 'reminder') {
      inner = `
        <div class="card-header">
          <span class="card-icon">🔔</span>
          <span class="card-title">Reminder Set</span>
          <button class="card-close" onclick="dismiss(this.closest('.hud-card'))">✕</button>
        </div>
        <div class="event-row">
          <div>
            <div class="event-name">${title || text || 'Reminder'}</div>
            <div class="event-sub">${card?.when || ''}</div>
            <span class="event-badge" style="background:rgba(245,158,11,0.15);color:#f59e0b;">✓ SET</span>
          </div>
        </div>`;
    } else if (type === 'email') {
      inner = `
        <div class="card-header">
          <span class="card-icon">📧</span>
          <span class="card-title">Email</span>
          <button class="card-close" onclick="dismiss(this.closest('.hud-card'))">✕</button>
        </div>
        <div class="event-row">
          <div>
            <div class="event-name">${title || 'Email Drafted'}</div>
            <div class="event-sub">${card?.to ? 'To: ' + card.to : text || ''}</div>
            <span class="event-badge" style="background:rgba(234,67,53,0.12);color:#ea4335;">✓ READY TO SEND</span>
          </div>
        </div>`;
    } else {
      // Default: AI text response bubble
      inner = `
        <div class="card-header">
          <span class="card-icon">◆</span>
          <span class="card-title">Callisto</span>
          <button class="card-close" onclick="dismiss(this.closest('.hud-card'))">✕</button>
        </div>
        <div class="card-text">${(text||'').replace(/\n/g,'<br>')}</div>`;
    }

    el.innerHTML = inner + `<div class="timer-bar"></div>`;
    stack.prepend(el);

    // Cap at 4 cards
    while (stack.children.length > 4) {
      dismiss(stack.lastElementChild, true);
    }

    // Auto-dismiss
    setTimeout(() => dismiss(el), dur * 1000);
  }

  function dismiss(el, instant = false) {
    if (!el || el._dismissing) return;
    el._dismissing = true;
    if (instant) { el.remove(); return; }
    el.classList.add('dismissing');
    setTimeout(() => el.remove(), 320);
  }
</script>
</body>
</html>
