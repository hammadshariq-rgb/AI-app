<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Callisto HUD</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{
      width:100%;height:100%;
      background:transparent;
      overflow:hidden;
      font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
      -webkit-app-region:no-drag;
      user-select:none;
    }

    /* ── Card stack — bottom-right ───────────────────────────────────────── */
    #stack{
      position:fixed;
      bottom:28px;right:28px;
      width:360px;
      display:flex;
      flex-direction:column-reverse;
      gap:12px;
      pointer-events:all;
    }

    /* ── Base card ───────────────────────────────────────────────────────── */
    .hud-card{
      position:relative;
      border-radius:20px;
      overflow:hidden;
      background:rgba(8,10,28,0.88);
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 24px 60px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.04),
        inset 0 1px 0 rgba(255,255,255,0.07);
      backdrop-filter:blur(28px) saturate(1.4);
      animation:slideIn 0.28s cubic-bezier(0.34,1.46,0.64,1) forwards;
      transition:opacity 0.25s, transform 0.25s;
      cursor:default;
    }
    .hud-card.dismissing{opacity:0;transform:translateX(24px) scale(0.94);}

    /* top accent line — colour set per type */
    .hud-card::before{
      content:'';
      position:absolute;top:0;left:0;right:0;height:1.5px;
      background:var(--accent-line,linear-gradient(90deg,transparent,rgba(100,140,255,0.7),rgba(0,210,255,0.5),transparent));
      z-index:2;
    }

    /* ── IMAGE BANNER (top of every card when image available) ──────────── */
    .card-banner{
      width:100%;
      height:160px;
      position:relative;
      overflow:hidden;
      background:rgba(15,18,40,0.9);
    }
    .card-banner img{
      width:100%;height:100%;
      object-fit:cover;
      display:block;
      filter:brightness(0.88) saturate(1.1);
    }
    /* gradient overlay so text sits on top nicely */
    .card-banner::after{
      content:'';
      position:absolute;inset:0;
      background:linear-gradient(to bottom,
        rgba(8,10,28,0)   0%,
        rgba(8,10,28,0.15) 50%,
        rgba(8,10,28,0.82) 100%);
    }
    /* title pinned to bottom of banner */
    .banner-title{
      position:absolute;bottom:0;left:0;right:0;
      padding:12px 14px;
      z-index:1;
    }
    .banner-title h2{
      font-size:15px;font-weight:700;
      color:#fff;
      line-height:1.2;
      text-shadow:0 1px 8px rgba(0,0,0,0.6);
      margin-bottom:2px;
    }
    .banner-title .sub{
      font-size:10.5px;font-weight:500;
      color:rgba(180,210,255,0.75);
      letter-spacing:.3px;
    }

    /* ── NO IMAGE placeholder ───────────────────────────────────────────── */
    .card-banner.no-img{
      height:auto;
      display:flex;align-items:center;gap:10px;
      padding:14px 14px 0;
      background:transparent;
    }
    .card-banner.no-img::after{display:none;}
    .card-icon-big{
      width:42px;height:42px;border-radius:12px;
      background:rgba(61,92,255,0.15);
      border:1px solid rgba(61,92,255,0.25);
      display:flex;align-items:center;justify-content:center;
      font-size:20px;flex-shrink:0;
    }
    .card-banner.no-img .banner-title{
      position:static;padding:0;
    }
    .card-banner.no-img .banner-title h2{font-size:13.5px;}

    /* ── Body / text area ───────────────────────────────────────────────── */
    .card-body{
      padding:12px 14px 14px;
    }
    .card-desc{
      font-size:12.5px;
      line-height:1.6;
      color:rgba(190,210,255,0.82);
      max-height:120px;
      overflow-y:auto;
      scrollbar-width:thin;
      scrollbar-color:rgba(94,114,228,0.25) transparent;
    }
    .card-desc::-webkit-scrollbar{width:3px;}
    .card-desc::-webkit-scrollbar-thumb{background:rgba(94,114,228,0.3);border-radius:2px;}
    .card-desc strong{color:#fff;}

    /* ── Header row (close + label) ─────────────────────────────────────── */
    .card-header{
      display:flex;align-items:center;
      padding:10px 12px 0;
      gap:6px;
    }
    .card-label{
      font-size:9px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;
      color:rgba(100,140,255,0.6);
      flex:1;
    }
    .card-close{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:50%;
      width:20px;height:20px;
      color:rgba(180,200,255,0.4);
      font-size:10px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .15s;
    }
    .card-close:hover{
      background:rgba(255,80,80,0.15);
      border-color:rgba(255,80,80,0.3);
      color:rgba(255,120,120,0.9);
    }

    /* ── Event row (calendar / reminder / email) ─────────────────────────── */
    .event-body{
      display:flex;align-items:center;gap:12px;
      padding:12px 14px 14px;
    }
    .event-icon-wrap{
      width:44px;height:44px;border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      font-size:22px;flex-shrink:0;
    }
    .event-name{font-size:13.5px;font-weight:700;color:#fff;margin-bottom:3px;}
    .event-sub{font-size:11px;color:rgba(150,180,255,0.65);}
    .event-badge{
      display:inline-flex;align-items:center;gap:4px;
      margin-top:6px;font-size:9px;font-weight:700;
      letter-spacing:1.2px;padding:3px 8px;border-radius:5px;
      text-transform:uppercase;
    }

    /* ── Timer drain bar ─────────────────────────────────────────────────── */
    .timer-bar{
      position:absolute;bottom:0;left:0;
      height:2px;
      background:linear-gradient(90deg,rgba(61,92,255,0.5),rgba(0,210,255,0.4));
      border-radius:0 0 20px 20px;
      animation:timerDrain var(--dur,8s) linear forwards;
    }
    @keyframes timerDrain{from{width:100%}to{width:0%}}

    @keyframes slideIn{
      from{opacity:0;transform:translateX(32px) scale(0.93);}
      to{opacity:1;transform:none;}
    }

    /* ── Listening indicator ─────────────────────────────────────────────── */
    #listening{
      position:fixed;bottom:28px;right:28px;
      background:rgba(8,10,28,0.92);
      border:1px solid rgba(61,92,255,0.35);
      border-radius:14px;
      padding:10px 18px;
      display:none;align-items:center;gap:10px;
      backdrop-filter:blur(24px);
      box-shadow:0 8px 32px rgba(0,0,0,0.55);
    }
    .mic-anim{display:flex;gap:3px;align-items:flex-end;height:18px;}
    .mic-bar{width:3px;border-radius:2px;background:rgba(0,200,255,0.85);animation:micPulse .6s ease-in-out infinite;}
    .mic-bar:nth-child(1){height:5px;animation-delay:0s;}
    .mic-bar:nth-child(2){height:11px;animation-delay:.1s;}
    .mic-bar:nth-child(3){height:17px;animation-delay:.2s;}
    .mic-bar:nth-child(4){height:10px;animation-delay:.1s;}
    .mic-bar:nth-child(5){height:5px;animation-delay:0s;}
    @keyframes micPulse{0%,100%{opacity:.35;transform:scaleY(.55);}50%{opacity:1;transform:scaleY(1);}}
    .listen-text{font-size:12px;font-weight:600;color:rgba(140,170,255,0.85);}
  </style>
</head>
<body>

<div id="listening">
  <div class="mic-anim">
    <div class="mic-bar"></div><div class="mic-bar"></div>
    <div class="mic-bar"></div><div class="mic-bar"></div>
    <div class="mic-bar"></div>
  </div>
  <span class="listen-text">Listening…</span>
</div>

<div id="stack"></div>

<script>
const { ipcRenderer } = require('electron');
const stack = document.getElementById('stack');
const listenEl = document.getElementById('listening');

ipcRenderer.on('hud:listening', () => {
  listenEl.style.display = 'flex';
  setTimeout(() => { listenEl.style.display = 'none'; }, 12000);
});
ipcRenderer.on('hud:listening-stop', () => { listenEl.style.display = 'none'; });
ipcRenderer.on('hud:card', (_e, data) => { listenEl.style.display = 'none'; showCard(data); });

// ── Colour config per card type ──────────────────────────────────────────────
const TYPE_CFG = {
  wiki:        { label:'Callisto',      icon:'🔍', line:'linear-gradient(90deg,transparent,rgba(80,200,120,0.7),rgba(0,220,180,0.4),transparent)', badge:null },
  info:        { label:'Callisto',      icon:'◆',  line:'linear-gradient(90deg,transparent,rgba(100,140,255,0.7),rgba(0,210,255,0.5),transparent)', badge:null },
  'magic-edit':{ label:'Magic Editor',  icon:'✏️', line:'linear-gradient(90deg,transparent,rgba(160,100,255,0.8),rgba(80,160,255,0.5),transparent)', badge:{text:'✓ EDITED', bg:'rgba(160,100,255,0.14)', color:'#b070ff'} },
  calendar: { label:'Calendar',  icon:'📅', line:'linear-gradient(90deg,transparent,rgba(66,133,244,0.7),transparent)', badge:{text:'✓ ADDED',   bg:'rgba(34,197,94,0.14)',  color:'#22c55e'} },
  reminder: { label:'Reminder',  icon:'🔔', line:'linear-gradient(90deg,transparent,rgba(245,158,11,0.7),transparent)', badge:{text:'✓ SET',     bg:'rgba(245,158,11,0.14)', color:'#f59e0b'} },
  email:    { label:'Email',     icon:'📧', line:'linear-gradient(90deg,transparent,rgba(234,67,53,0.6),transparent)',  badge:{text:'✓ DRAFTED', bg:'rgba(234,67,53,0.12)',  color:'#ea4335'} },
};

function showCard(data) {
  const { type, text, card, title } = data;
  const cfg = TYPE_CFG[type] || TYPE_CFG.info;
  const dur = (type === 'wiki' || type === 'info') ? 10 : 7;

  // Everything shown is text, never markup: this window can reach the system, and
  // the words come from the web and from whatever was circled on screen.
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Gather image URL — try card.imageUrl first, then card.image, then card.photo
  const rawImg = card?.imageUrl || card?.image || card?.photo || '';
  const imgUrl = /^(?:https?:|data:image\/)/i.test(rawImg) ? esc(rawImg) : null;

  // Card title / subtitle
  const cardTitle = esc(card?.title || title || (type === 'wiki' ? 'Identified' : cfg.label));
  const cardSub   = esc(card?.source || card?.category || '');
  const bodyText  = esc(card?.summary || card?.description || text || '');
  const eventSub  = esc(card?.when || (card?.to ? 'To: ' + card.to : ''));

  const el = document.createElement('div');
  el.className = `hud-card ${type || 'info'}`;
  el.style.setProperty('--dur', dur + 's');
  el.style.setProperty('--accent-line', cfg.line);

  let html = '';

  // ── Header row (always) ──────────────────────────────────────────────────
  html += `
    <div class="card-header">
      <span class="card-label">${cfg.label}</span>
      <button class="card-close" onclick="dismiss(this.closest('.hud-card'))">✕</button>
    </div>`;

  // ── Event-style cards (calendar / reminder / email) ──────────────────────
  if (['calendar','reminder','email'].includes(type)) {
    const iconBg = type==='calendar'?'rgba(66,133,244,0.14)':type==='reminder'?'rgba(245,158,11,0.13)':'rgba(234,67,53,0.13)';
    html += `
      <div class="event-body">
        <div class="event-icon-wrap" style="background:${iconBg}">${cfg.icon}</div>
        <div>
          <div class="event-name">${cardTitle}</div>
          <div class="event-sub">${eventSub || bodyText.slice(0, 80)}</div>
          ${cfg.badge ? `<span class="event-badge" style="background:${cfg.badge.bg};color:${cfg.badge.color}">${cfg.badge.text}</span>` : ''}
        </div>
      </div>`;

  // ── Knowledge / info cards — image banner ───────────────────────────────
  } else {
    if (imgUrl) {
      // Big banner image with title overlaid
      html += `
        <div class="card-banner">
          <img src="${imgUrl}" alt="${cardTitle}" onerror="this.parentNode.classList.add('img-err');this.style.display='none'"/>
          <div class="banner-title">
            <h2>${cardTitle}</h2>
            ${cardSub ? `<div class="sub">${cardSub}</div>` : ''}
          </div>
        </div>
        <div class="card-body">
          <div class="card-desc">${bodyText.replace(/\n/g,'<br>')}</div>
        </div>`;
    } else {
      // No image — icon + title inline, then text below
      html += `
        <div class="card-banner no-img">
          <div class="card-icon-big">${cfg.icon}</div>
          <div class="banner-title">
            <h2>${cardTitle}</h2>
            ${cardSub ? `<div class="sub">${cardSub}</div>` : ''}
          </div>
        </div>
        <div class="card-body">
          <div class="card-desc">${bodyText.replace(/\n/g,'<br>')}</div>
        </div>`;
    }
  }

  html += `<div class="timer-bar"></div>`;
  el.innerHTML = html;
  stack.prepend(el);

  // Cap at 4 cards
  while (stack.children.length > 4) dismiss(stack.lastElementChild, true);

  setTimeout(() => dismiss(el), dur * 1000);
}

function dismiss(el, instant = false) {
  if (!el || el._dismissing) return;
  el._dismissing = true;
  if (instant) { el.remove(); return; }
  el.classList.add('dismissing');
  setTimeout(() => el.remove(), 280);
}
</script>
<style>
/* ── A small offer, over whatever you are working in ────────────────────────
   Built from the AlertCard the owner picked - the lifted rounded card, the
   pulsing icon in its own circle, the pill to act on - but shrunk to a single
   glanceable line, because it appears over somebody's work rather than in a
   page of its own. Big enough to read without looking away from what you were
   doing; small enough to ignore.
   Its red is kept for things that are genuinely wrong - a wrong answer, a
   failing step. An offer to diarise something is not a warning, so those come
   up in the app's own violet. A card that shouts every time gets switched off.
   Three seconds, and letting it run out is a no. Nothing happens unasked. */
.hud-prompt {
  --hp-bg: linear-gradient(150deg, #241a4d, #151b38);
  --hp-edge: rgba(139, 92, 246, 0.5);
  --hp-pill: linear-gradient(135deg, #8b5cf6, #3d5cff);
  --hp-pill-ink: #fff;
  position: relative;
  margin: 8px 10px 0 auto;
  width: 262px;
  padding: 9px 10px 11px 11px;
  border-radius: 12px;
  background: var(--hp-bg);
  border: 1px solid var(--hp-edge);
  box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.25);
  font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: #f2f5ff;
  pointer-events: auto;
  overflow: hidden;
  animation: hpIn .3s cubic-bezier(.2,1.3,.4,1);
}
.hud-prompt.alert {
  --hp-bg: linear-gradient(150deg, #5b1526, #3a1020);
  --hp-edge: rgba(248, 113, 113, 0.55);
  --hp-pill: #fff;
  --hp-pill-ink: #7f1d2e;
}
@keyframes hpIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
.hud-prompt.going { opacity: 0; transform: translateY(8px) scale(.98); transition: opacity .18s, transform .18s; }

.hp-row { display: flex; align-items: center; gap: 8px; }
.hp-main { flex: 1; min-width: 0; }
/* The button sits under the text, not beside it. In a 262px card a worded
   button and a sentence cannot share a line: the button wins the space and
   the offer itself gets squeezed down to "That ans...", which is unanswerable. */
.hp-actions { display: flex; margin-top: 8px; }

.hp-icon {
  flex: none; width: 22px; height: 22px; border-radius: 50%;
  background: rgba(255,255,255,0.1);
  display: grid; place-items: center; font-size: 11px;
  animation: hpPulse 1.6s ease-in-out infinite;
}
@keyframes hpPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

.hp-title { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
.hp-desc  { margin-top: 1px; font-size: 11px; line-height: 1.3; color: rgba(242,245,255,0.72); }
/* The title may run to two lines. Clipping it loses the very thing being
   offered - "Meeting at 5 PM tomorr..." is not something anyone can answer. */
.hp-title {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.hp-desc {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

.hp-pill {
  flex: 1; padding: 6px 11px;
  border: none; border-radius: 999px;
  background: var(--hp-pill); color: var(--hp-pill-ink);
  font-family: inherit; font-size: 11.5px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  transition: transform .12s ease, filter .16s ease;
}
.hp-pill:hover { filter: brightness(1.1); }
.hp-pill:active { transform: scale(.96); }

.hp-x {
  flex: none; width: 22px; height: 22px;
  border: none; border-radius: 6px;
  background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.65);
  font-size: 11px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}
.hp-x:hover { background: rgba(255,255,255,0.16); color: #fff; }

.hp-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,0.08); }
.hp-bar i {
  display: block; height: 100%; width: 100%;
  background: var(--hp-pill); transform-origin: left center;
  animation: hpCount var(--secs, 3s) linear forwards;
}
@keyframes hpCount { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.hp-done { font-size: 12px; font-weight: 600; color: #9ee6b4; }

@media (prefers-reduced-motion: reduce) {
  .hud-prompt { animation: none; }
  .hp-icon { animation: none; }
}
</style>
<script>
// Offers raised while watching the screen. One at a time - a stack of these
// over somebody's work would be worse than saying nothing.
let _hudPromptEl = null;
let _hudPromptTimer = null;

function _closeHudPrompt() {
  if (_hudPromptTimer) { clearTimeout(_hudPromptTimer); _hudPromptTimer = null; }
  const el = _hudPromptEl;
  _hudPromptEl = null;
  if (!el) return;
  el.classList.add('going');
  setTimeout(() => el.remove(), 220);
}

function _showHudPrompt(d) {
  if (!d || !d.id || !d.title) return;
  _closeHudPrompt();
  const secs = Math.max(2, Math.min(15, Number(d.seconds) || 3));

  const el = document.createElement('div');
  el.className = 'hud-prompt' + (d.tone === 'alert' ? ' alert' : '');
  el.style.setProperty('--secs', secs + 's');
  el.setAttribute('role', 'alert');

  const x = document.createElement('button');
  x.className = 'hp-x';
  x.textContent = '✕';
  x.title = 'Dismiss';

  const icon = document.createElement('div');
  icon.className = 'hp-icon';
  icon.textContent = d.icon || (d.tone === 'alert' ? '⚠' : '✨');

  const title = document.createElement('div');
  title.className = 'hp-title';
  title.textContent = d.title;

  const desc = document.createElement('div');
  desc.className = 'hp-desc';
  desc.textContent = d.description || '';

  const pill = document.createElement('button');
  pill.className = 'hp-pill';
  pill.textContent = d.buttonText || 'Yes, do it';

  const bar = document.createElement('div');
  bar.className = 'hp-bar';
  bar.appendChild(document.createElement('i'));

  const answer = (ok) => {
    if (_hudPromptTimer) { clearTimeout(_hudPromptTimer); _hudPromptTimer = null; }
    ipcRenderer.send('hud:prompt-answer', { id: d.id, yes: ok });
    if (!ok) return _closeHudPrompt();
    // Say it landed, rather than vanishing as though nothing happened.
    actions.remove(); bar.remove(); x.remove(); desc.remove();
    icon.textContent = '✓';
    title.className = 'hp-done';
    title.textContent = d.doneLabel || 'Done.';
    setTimeout(_closeHudPrompt, 1300);
  };
  pill.addEventListener('click', () => answer(true));
  x.addEventListener('click', () => answer(false));

  // What it is on the top line with the way out, what pressing it does
  // underneath. Small enough to ignore, legible enough to answer.
  const row = document.createElement('div');
  row.className = 'hp-row';
  const main = document.createElement('div');
  main.className = 'hp-main';
  main.appendChild(title);
  if (d.description) main.appendChild(desc);
  if (d.icon !== false) row.appendChild(icon);
  row.appendChild(main);
  row.appendChild(x);

  const actions = document.createElement('div');
  actions.className = 'hp-actions';
  actions.appendChild(pill);

  el.appendChild(row);
  el.appendChild(actions);
  el.appendChild(bar);
  el._row = row;
  document.body.appendChild(el);
  _hudPromptEl = el;

  // Running out of time is a no.
  _hudPromptTimer = setTimeout(() => {
    ipcRenderer.send('hud:prompt-answer', { id: d.id, yes: false, timedOut: true });
    _closeHudPrompt();
  }, secs * 1000);
}

ipcRenderer.on('hud:prompt', (_e, d) => _showHudPrompt(d));
ipcRenderer.on('hud:prompt-close', _closeHudPrompt);
</script>
</body>
</html>
