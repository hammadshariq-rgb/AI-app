name: Build Windows + Mac

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Grant write access to releases so electron-builder can upload assets
permissions:
  contents: write

jobs:

  # The release tag follows app/package.json, so bumping the version there is all
  # it takes to ship an update — installed apps look for exactly this tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get.outputs.tag }}
      version: ${{ steps.get.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: get
        shell: bash
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION"

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    needs: version
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Create .env for build
        working-directory: app
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        shell: bash
        run: |
          echo "LICENSE_SERVER_URL=https://ai-app-production-9224.up.railway.app" >> .env
          echo "ASSISTANT_NAME=Jarvis" >> .env
          echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> .env

      # --publish always uploads the installer AND latest.yml, the file the
      # installed app reads to discover updates. Without it auto-update can't work.
      # Signs through Azure Trusted Signing when its secrets are present,
      # otherwise builds unsigned as before. AZURE_TENANT_ID / AZURE_CLIENT_ID /
      # AZURE_CLIENT_SECRET are read by electron-builder itself; the rest describe
      # the signing account.
      - name: Build and publish Windows installer
        working-directory: app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_SIGN_ACCOUNT" ] && [ -n "$AZURE_CERT_PROFILE" ]; then
            echo "Signing with Azure Trusted Signing."
            npx electron-builder --win --publish always \
              --config.win.azureSignOptions.endpoint="$AZURE_SIGN_ENDPOINT" \
              --config.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGN_ACCOUNT" \
              --config.win.azureSignOptions.certificateProfileName="$AZURE_CERT_PROFILE" \
              --config.win.azureSignOptions.publisherName="$AZURE_PUBLISHER_NAME"
          else
            echo "No Azure signing secrets set — building unsigned."
            unset AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET
            npx electron-builder --win --publish always
          fi

      - name: Save EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: callisto-windows-exe
          path: app/dist/*.exe
          retention-days: 30

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-mac:
    needs: version
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Create .env for build
        working-directory: app
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          echo "LICENSE_SERVER_URL=https://ai-app-production-9224.up.railway.app" >> .env
          echo "ASSISTANT_NAME=Jarvis" >> .env
          echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> .env

      # Signs and notarises with a Developer ID when the secrets are present,
      # otherwise falls back to the ad-hoc signature (build/adhoc-sign.js), which
      # lets the app launch on Apple silicon but still shows Gatekeeper's
      # "unidentified developer" prompt on first open. Note that macOS
      # auto-update only works once the app is signed with a Developer ID.
      - name: Build and publish Mac DMG
        working-directory: app
        shell: bash
        # The secrets are read under their own names, never as CSC_LINK directly:
        # an empty CSC_LINK still looks configured to electron-builder, which then
        # tries to read a certificate from an empty path and fails.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          # Apple's own preferred way in: an App Store Connect key instead of an
          # Apple ID and app-specific password. Used when these three are set.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_CERT_P12" ] && [ -n "$APPLE_ID_SECRET" ]; then
            echo "Signing with Developer ID and notarising."
            # The certificate is imported here rather than through CSC_LINK:
            # electron-builder makes its own keychain with one password and then
            # unlocks it with the certificate's, which fails ("the user name or
            # passphrase you entered is not correct"). A keychain of our own,
            # handed over as CSC_KEYCHAIN, avoids that entirely — and
            # find-identity below proves the certificate arrived.
            # CSC_LINK must stay unset, or electron-builder ignores CSC_KEYCHAIN
            # and builds its own keychain again.
            unset CSC_LINK CSC_KEY_PASSWORD
            KEYCHAIN="$RUNNER_TEMP/callisto-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
            echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
              -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "Signing identities available:"
            security find-identity -v -p codesigning "$KEYCHAIN"
            export CSC_KEYCHAIN="$KEYCHAIN"
            export APPLE_TEAM_ID="$APPLE_TEAM"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            # Notarisation identifies itself with an App Store Connect key when one
            # is set, otherwise with the Apple ID and its app-specific password.
            if [ -n "$APPLE_API_KEY_P8" ]; then
              mkdir -p "$RUNNER_TEMP/private_keys"
              KEY_FILE="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
              echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_FILE"
              export APPLE_API_KEY="$KEY_FILE"
              export APPLE_API_KEY_ID="$APPLE_API_KEY_ID_SECRET"
              export APPLE_API_ISSUER="$APPLE_API_ISSUER_SECRET"
              NOTARY_CHECK=(xcrun notarytool history --key "$KEY_FILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
              WHAT="App Store Connect key"
            else
              export APPLE_ID="$APPLE_ID_SECRET"
              export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_PASSWORD"
              NOTARY_CHECK=(xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
              WHAT="Apple ID and app-specific password"
            fi
            # Check the login before building: Apple otherwise rejects it at the
            # very end, after ten minutes of packaging.
            if ! "${NOTARY_CHECK[@]}" > /dev/null 2>&1; then
              echo "::error::Apple rejected the notarisation login ($WHAT). For a key: APPLE_API_KEY_P8 is the base64 of the .p8 file, APPLE_API_KEY_ID is the Key ID, APPLE_API_ISSUER is the Issuer ID. For a password: APPLE_ID must own the membership and APPLE_APP_SPECIFIC_PASSWORD must come from appleid.apple.com for that same Apple ID."
              exit 1
            fi
            echo "Notarisation login accepted ($WHAT)."
            npx electron-builder --mac --publish always \
              --config.mac.notarize.teamId="$APPLE_TEAM"
          else
            echo "No Apple credentials set — building with the ad-hoc signature."
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --publish always
          fi

      - name: Save DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: callisto-mac-dmg
          path: app/dist/*.dmg
          retention-days: 30

  # electron-builder creates the release as a draft. Publishing it is what makes
  # installed apps see the update, so do it once both platforms have uploaded.
  publish-release:
    needs: [version, build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest \
            --title "PERSONAL AI ASSISTANT CALLISTO ${TAG}"
          echo "Released $TAG"
          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name'
