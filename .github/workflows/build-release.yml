name: Build Windows + Mac

# Triggers: manual dispatch OR any v* tag push
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# All builds always upload their assets to the SINGLE "Latest" release (v1.1.3).
# This keeps one download page for users regardless of how many code versions ship.
env:
  RELEASE_TAG: v1.1.3

jobs:

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Create .env for build
        working-directory: app
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        shell: bash
        run: |
          echo "LICENSE_SERVER_URL=https://ai-app-production-9224.up.railway.app" >> .env
          echo "ASSISTANT_NAME=Jarvis" >> .env
          echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> .env

      - name: Build Windows installer
        working-directory: app
        run: npx electron-builder --win --publish never

      # Always upload to the fixed v1.1.3 release (overwrites old files with same name)
      - name: Upload EXE to v1.1.3 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "PERSONEL AI ASSISTANT CALLISTO V1.1.3"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app/dist/*.exe
            app/dist/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also save as a workflow artifact so you can download it directly from Actions
      - name: Save EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: callisto-windows-exe
          path: |
            app/dist/*.exe
            app/dist/*.msi
          retention-days: 30

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Create .env for build
        working-directory: app
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          echo "LICENSE_SERVER_URL=https://ai-app-production-9224.up.railway.app" >> .env
          echo "ASSISTANT_NAME=Jarvis" >> .env
          echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> .env

      - name: Build Mac DMG
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # unsigned — skip code signing
        run: npx electron-builder --mac --publish never

      # Always upload to the fixed v1.1.3 release
      - name: Upload DMG to v1.1.3 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "PERSONEL AI ASSISTANT CALLISTO V1.1.3"
          draft: false
          prerelease: false
          make_latest: true
          files: app/dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also save as a workflow artifact
      - name: Save DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: callisto-mac-dmg
          path: app/dist/*.dmg
          retention-days: 30
