name: Build Jarvis

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build for ${{ matrix.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resize icon (macOS)
        if: matrix.os == 'macos-latest'
        run: sips -z 512 512 app/assets/icon.png

      - name: Resize icon (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y imagemagick
          convert app/assets/icon.png -resize 512x512! app/assets/icon.png

      - name: Install dependencies
        run: npm install
        working-directory: app

      - name: Build and publish
        run: npm run dist
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
