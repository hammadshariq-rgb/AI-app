<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Callisto AI</title>
  <meta name="description" content="Your Own Personal AI — Chat with Callisto, your intelligent AI assistant." />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── AUTH MODAL ─────────────────────────────────────────────────────────── -->
<div id="authOverlay" class="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-orb"></div>
      <span class="auth-brand">CALLISTO</span>
    </div>
    <p class="auth-tagline">Your Own Personal AI</p>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin">Sign In</button>
      <button class="auth-tab" id="tabSignup">Create Account</button>
    </div>

    <!-- Login form -->
    <form id="loginForm" class="auth-form">
      <input type="email"    id="loginEmail"    class="auth-input" placeholder="Email address" required autocomplete="email" />
      <input type="password" id="loginPassword" class="auth-input" placeholder="Password"      required autocomplete="current-password" />
      <button type="submit" class="auth-submit">Sign In</button>
      <p class="auth-error hidden" id="loginError"></p>
    </form>

    <!-- Signup form -->
    <form id="signupForm" class="auth-form hidden">
      <input type="text"     id="signupName"     class="auth-input" placeholder="Your name"      required autocomplete="name" />
      <input type="email"    id="signupEmail"    class="auth-input" placeholder="Email address"  required autocomplete="email" />
      <input type="password" id="signupPassword" class="auth-input" placeholder="Password (min 8 chars)" required autocomplete="new-password" minlength="8" />
      <button type="submit" class="auth-submit">Create Account</button>
      <p class="auth-error hidden" id="signupError"></p>
    </form>

    <p class="auth-footer">By continuing you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a>.</p>
  </div>
</div>

<!-- ── MAIN APP ───────────────────────────────────────────────────────────── -->
<div id="app" class="app hidden">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <div class="mini-orb"></div>
        <span>CALLISTO</span>
      </div>
      <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>
    </div>

    <div class="sidebar-history" id="sidebarHistory">
      <p class="history-label">Recent</p>
      <!-- history items injected by JS -->
    </div>

    <div class="sidebar-bottom">
      <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">C</div>
        <div class="user-details">
          <span class="user-name" id="userName">—</span>
          <span class="user-email" id="userEmail">—</span>
        </div>
      </div>
      <button class="sign-out-btn" id="signOutBtn" title="Sign out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- MOBILE SIDEBAR TOGGLE -->
  <button class="sidebar-toggle" id="sidebarToggle">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- MAIN CHAT AREA -->
  <main class="chat-main" id="chatMain">

    <!-- Empty state (shown before first message) -->
    <div class="empty-state" id="emptyState">
      <div class="empty-orb" id="emptyOrb"></div>
      <h1 class="empty-title">How can I help you today?</h1>
      <p class="empty-sub">Ask me anything — I'm your personal AI assistant.</p>
      <div class="suggestion-chips">
        <button class="chip" data-text="What can you help me with?">What can you help me with?</button>
        <button class="chip" data-text="Write me a professional email">Write a professional email</button>
        <button class="chip" data-text="Explain something complex to me simply">Explain something simply</button>
        <button class="chip" data-text="Help me plan my day">Help me plan my day</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages"></div>

    <!-- Thinking indicator -->
    <div class="thinking-row hidden" id="thinkingRow">
      <div class="thinking-avatar">
        <div class="thinking-orb"></div>
      </div>
      <div class="thinking-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <div class="input-wrap" id="inputWrap">
        <textarea
          id="messageInput"
          class="message-input"
          placeholder="Message Callisto…"
          rows="1"
          autocomplete="off"
        ></textarea>
        <button class="send-btn" id="sendBtn" title="Send" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
        <button class="stop-btn hidden" id="stopBtn" title="Stop">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        </button>
      </div>
      <p class="input-hint">Callisto can make mistakes. Verify important information.</p>
    </div>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
